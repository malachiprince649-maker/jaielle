<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jaielle Decryption Tool</title>
<style>
  :root {
    --pink-1: #ff4d94;
    --pink-2: #d63384;
    --pink-3: #ffb6d9;
    --bg-1: #fff0f5;
    --bg-2: #ffe4ef;
    --text: #3d1f2e;
    --text-soft: #7a5a68;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    position: relative;
  }

  /* Animated background blobs */
  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.55;
    z-index: 0;
    pointer-events: none;
  }
  .blob-1 { width: 380px; height: 380px; background: #ff8fc0; top: -120px; left: -120px; animation: float1 14s ease-in-out infinite; }
  .blob-2 { width: 320px; height: 320px; background: #ffc2dd; bottom: -100px; right: -80px; animation: float2 18s ease-in-out infinite; }
  .blob-3 { width: 260px; height: 260px; background: #ffb0d1; top: 40%; left: 55%; animation: float3 20s ease-in-out infinite; }

  @keyframes float1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(60px,40px)} }
  @keyframes float2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-50px,-30px)} }
  @keyframes float3 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-40px,50px)} }

  .box {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 540px;
    margin: 24px;
    padding: 34px 30px 30px;
    background: rgba(255, 255, 255, 0.72);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255, 255, 255, 0.8);
    border-radius: 24px;
    box-shadow:
      0 20px 60px rgba(214, 51, 132, 0.18),
      0 4px 14px rgba(214, 51, 132, 0.08);
    animation: rise 0.6s cubic-bezier(.2,.9,.3,1.2) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(18px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .header {
    text-align: center;
    margin-bottom: 22px;
  }

  .badge {
    display: inline-block;
    padding: 6px 12px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--pink-2);
    background: rgba(255, 77, 148, 0.12);
    border: 1px solid rgba(255, 77, 148, 0.25);
    border-radius: 999px;
    margin-bottom: 14px;
  }

  h1 {
    font-size: 28px;
    font-weight: 800;
    margin: 0 0 6px;
    background: linear-gradient(135deg, var(--pink-1), var(--pink-2));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.02em;
  }

  .subtitle {
    font-size: 14px;
    color: var(--text-soft);
    margin: 0;
  }

  .field {
    position: relative;
    margin-top: 16px;
  }

  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-soft);
    margin-bottom: 6px;
    letter-spacing: 0.04em;
  }

  textarea, input[type="text"], input[type="password"] {
    width: 100%;
    padding: 14px 16px;
    font-size: 14px;
    font-family: inherit;
    color: var(--text);
    background: rgba(255, 255, 255, 0.9);
    border: 1.5px solid var(--pink-3);
    border-radius: 14px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    resize: vertical;
  }

  textarea { min-height: 96px; }

  textarea:focus, input:focus {
    border-color: var(--pink-1);
    box-shadow: 0 0 0 4px rgba(255, 77, 148, 0.15);
    background: #fff;
  }

  textarea::placeholder, input::placeholder {
    color: #c9a5b5;
  }

  .input-row {
    display: flex;
    gap: 8px;
    align-items: stretch;
  }

  .input-row input { flex: 1; }

  .icon-btn {
    padding: 0 14px;
    font-size: 13px;
    font-weight: 600;
    color: var(--pink-2);
    background: rgba(255, 77, 148, 0.08);
    border: 1.5px solid var(--pink-3);
    border-radius: 14px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    white-space: nowrap;
  }

  .icon-btn:hover { background: rgba(255, 77, 148, 0.16); }
  .icon-btn:active { transform: scale(0.97); }

  .counter {
    position: absolute;
    right: 12px;
    bottom: 8px;
    font-size: 11px;
    color: #c9a5b5;
    pointer-events: none;
  }

  .actions {
    margin-top: 20px;
    display: flex;
    gap: 10px;
  }

  button.primary {
    flex: 1;
    padding: 15px 22px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: #fff;
    background: linear-gradient(135deg, var(--pink-1), var(--pink-2));
    border: none;
    border-radius: 14px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    box-shadow: 0 10px 24px rgba(214, 51, 132, 0.32);
    transition: transform 0.12s, box-shadow 0.2s, filter 0.2s;
  }

  button.primary:hover { filter: brightness(1.06); box-shadow: 0 14px 30px rgba(214, 51, 132, 0.4); }
  button.primary:active { transform: translateY(1px) scale(0.995); }
  button.primary:disabled { opacity: 0.75; cursor: wait; }

  button.primary::after {
    content: "";
    position: absolute;
    top: 0; left: -40%;
    width: 40%; height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.45), transparent);
    transform: skewX(-20deg);
    transition: left 0.6s;
  }
  button.primary:hover::after { left: 120%; }

  .result {
    margin-top: 22px;
    padding: 18px 18px 16px;
    background: linear-gradient(135deg, rgba(255,77,148,0.08), rgba(214,51,132,0.05));
    border: 1px solid rgba(255, 77, 148, 0.28);
    border-radius: 16px;
    display: none;
    animation: fadeIn 0.35s ease both;
  }

  .result.show { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .result-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  .result-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--pink-2);
  }

  .copy-btn {
    font-size: 11px;
    font-weight: 700;
    color: var(--pink-2);
    background: transparent;
    border: 1px solid rgba(255, 77, 148, 0.35);
    padding: 5px 10px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .copy-btn:hover { background: rgba(255, 77, 148, 0.12); }

  .result-text {
    font-size: 15px;
    font-weight: 600;
    color: var(--pink-2);
    word-break: break-word;
    white-space: pre-wrap;
    line-height: 1.5;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(61, 31, 46, 0.94);
    color: #fff;
    padding: 12px 20px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s, transform 0.25s;
    z-index: 100;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .toast.error { background: rgba(200, 30, 70, 0.95); }

  /* Spinner */
  .spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: -3px;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .footer {
    margin-top: 18px;
    text-align: center;
    font-size: 11px;
    color: #b88aa0;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>

<div class="box">
  <div class="header">
    <span class="badge">🔒 Encrypted Vault</span>
    <h1>Jaielle Decryption</h1>
    <p class="subtitle">Paste the encrypted message and enter the key to unlock it.</p>
  </div>

  <div class="field">
    <label for="msg">Encrypted message</label>
    <textarea id="msg" placeholder="Paste your base64-encoded message here…" maxlength="5000"></textarea>
    <span class="counter" id="counter">0 / 5000</span>
  </div>

  <div class="field">
    <label for="key">Secret key</label>
    <div class="input-row">
      <input id="key" type="password" placeholder="Enter key…" autocomplete="off" />
      <button type="button" class="icon-btn" id="toggleKey" aria-label="Show key">👁 Show</button>
    </div>
  </div>

  <div class="actions">
    <button class="primary" id="unlockBtn" onclick="decrypt()">
      <span id="btnText">🔓 Unlock Message</span>
    </button>
  </div>

  <div class="result" id="result">
    <div class="result-header">
      <span class="result-label">Decrypted</span>
      <button class="copy-btn" id="copyBtn" onclick="copyResult()">Copy</button>
    </div>
    <div class="result-text" id="output"></div>
  </div>

  <div class="footer">XOR • Base64 • Jaielle</div>
</div>

<div class="toast" id="toast"></div>

<script>
  const msgEl    = document.getElementById("msg");
  const keyEl    = document.getElementById("key");
  const outputEl = document.getElementById("output");
  const resultEl = document.getElementById("result");
  const counter  = document.getElementById("counter");
  const btn      = document.getElementById("unlockBtn");
  const btnText  = document.getElementById("btnText");
  const toastEl  = document.getElementById("toast");
  const toggleBtn= document.getElementById("toggleKey");

  const SECRET_KEY = "JAIELLE";

  // Live character counter
  msgEl.addEventListener("input", () => {
    counter.textContent = `${msgEl.value.length} / 5000`;
  });

  // Show / hide key
  toggleBtn.addEventListener("click", () => {
    const isPwd = keyEl.type === "password";
    keyEl.type = isPwd ? "text" : "password";
    toggleBtn.textContent = isPwd ? "🙈 Hide" : "👁 Show";
  });

  // Toast helper
  let toastTimer;
  function toast(message, isError = false) {
    clearTimeout(toastTimer);
    toastEl.textContent = message;
    toastEl.classList.toggle("error", isError);
    toastEl.classList.add("show");
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2400);
  }

  // Copy result
  function copyResult() {
    const text = outputEl.textContent;
    if (!text) return;
    navigator.clipboard.writeText(text).then(
      () => toast("Copied to clipboard ✓"),
      () => toast("Couldn't copy — select manually", true)
    );
  }

  // Decrypt
  function decrypt() {
    const enc = msgEl.value.trim();
    const key = keyEl.value.trim();

    if (!enc || !key) {
      toast("Please fill in both fields", true);
      return;
    }
    if (key !== SECRET_KEY) {
      toast("Incorrect key", true);
      return;
    }

    // Loading state
    btn.disabled = true;
    btnText.innerHTML = '<span class="spinner"></span>Decrypting…';
    resultEl.classList.remove("show");

    setTimeout(() => {
      try {
        const decoded = atob(enc);
        let result = "";
        for (let i = 0; i < decoded.length; i++) {
          result += String.fromCharCode(
            decoded.charCodeAt(i) ^ key.charCodeAt(i % key.length)
          );
        }
        outputEl.textContent = result;
        resultEl.classList.add("show");
        toast("Message unlocked ✓");
      } catch (e) {
        outputEl.textContent = "";
        resultEl.classList.remove("show");
        toast("Failed to decrypt. Check the message.", true);
      } finally {
        btn.disabled = false;
        btnText.textContent = "🔓 Unlock Message";
      }
    }, 350);
  }

  // Enter key submits (except inside textarea)
  document.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && document.activeElement === keyEl) {
      decrypt();
    }
  });
</script>
</body>
</html>
